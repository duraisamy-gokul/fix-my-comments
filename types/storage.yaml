Storage:
  WorkspaceIdentity:
    description: Workspace identity derived from repo root and Git branch
    type: object
    required: [repoRoot, branch, key]
    properties:
      repoRoot:
        description: Absolute path to the repository root
        type: string
      branch:
        description: Current Git branch name
        type: string
      key:
        description: Short SHA1 of repoRoot@branch used as the storage key
        type: string

  TaskFile:
    description: Root shape of the tasks.json storage file
    type: object
    required: [schemaVersion, tasks]
    properties:
      schemaVersion:
        description: Storage schema version
        type: number
      tasks:
        description: All tasks for this workspace and branch
        type: array
        items:
          $ref: './types/task.yaml#/Task/Task'

  MessageFile:
    description: Root shape of the messages.json storage file
    type: object
    required: [schemaVersion, messages]
    properties:
      schemaVersion:
        description: Storage schema version
        type: number
      messages:
        description: All thread messages across tasks for this workspace and branch
        type: array
        items:
          $ref: './types/task.yaml#/Task/TaskMessage'

  HistoryFile:
    description: Root shape of the history.json storage file
    type: object
    required: [schemaVersion, events]
    properties:
      schemaVersion:
        description: Storage schema version
        type: number
      events:
        description: All history events across tasks for this workspace and branch
        type: array
        items:
          $ref: './types/task.yaml#/Task/TaskHistoryEvent'
