name: Subtask
description: A single roadmap subtask (one pull request of work)
title: '[Phase N] <subtask name>'
labels: ['subtask']
body:
  - type: markdown
    attributes:
      value: |
        One subtask = one pull request. To claim this subtask, comment "Claiming this"
        and open a draft PR with `Closes #<this-issue>`. Check recent comments and linked
        PRs first — if it is already taken, pick another one. See CONTRIBUTING.md.
  - type: input
    id: phase
    attributes:
      label: Phase
      description: Which roadmap phase does this belong to?
      placeholder: 'Phase 1 — Minimal Local Task System'
    validations:
      required: true
  - type: input
    id: checklist-item
    attributes:
      label: Checklist item
      description: The exact subtask text from the phase checklist.md
      placeholder: 'Storage layer — local storage service keyed by repo + branch'
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this subtask includes and explicitly does not include.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer confirms this subtask is done.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before claiming
      options:
        - label: I have read CONTRIBUTING.md and checked this subtask is not already claimed.
          required: true
